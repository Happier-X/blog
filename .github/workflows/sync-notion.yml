name: Sync Notion Posts

on:
  schedule:
    # 每天中午12点 (UTC 04:00，对应北京时间12点)
    - cron: "0 12 * * *"
  workflow_dispatch:
    # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm add @notionhq/client notion-to-md gray-matter

      - name: Sync Notion to Markdown
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          POSTS_DIR: content/posts
        run: node scripts/sync-notion.js

      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git ls-files --others --exclude-standard content/posts/ | grep '\.md$' | head -20)" >> $GITHUB_OUTPUT
          echo "deleted=$(git ls-files --deleted content/posts/ | head -20)" >> $GITHUB_OUTPUT

      - name: Commit and push using GitHub API
        if: steps.changed-files.outputs.files != '' || steps.changed-files.outputs.deleted != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          commit-message: "docs: sync Notion posts $(date +'%Y-%m-%d %H:%M')"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          title: "Sync Notion posts $(date +'%Y-%m-%d')"
          body: "Automated sync from Notion"
          branch: sync-notion-posts
          delete-branch: true
          add-paths: content/posts/
